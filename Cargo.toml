[package]
name = "t4a-cuda-kernels"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
authors = ["Hiroshi Shinaoka <h.shinaoka@gmail.com>", "tensor4all contributors"]
repository = "https://github.com/tensor4all/t4a-cuda-kernels"
description = "Runtime-independent CUDA kernels for tensor4all and external CUDA consumers"
readme = "README.md"
keywords = ["cuda", "gpu", "kernels", "nvrtc", "tensor4all"]
categories = ["hardware-support", "science"]
# The NVRTC sources under cuda/ are part of the library (include_str!); design docs,
# worklogs and benchmark tooling stay in the repository.
include = [
    "/src/**",
    "/cuda/**",
    "/tests/**",
    "/examples/**",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/NOTICE",
    "/THIRD_PARTY_NOTICES.md",
]

[features]
default = []
# Tests that compile the kernel sources with nvcc and run them on a real device.
# An invoked GPU test on a host without a usable device fails; it never silently
# passes.
gpu-tests = ["dep:cudarc"]

[dependencies]
# Only the GPU tests use it; the library itself has no dependency.
cudarc = { version = "=0.19.8", default-features = false, features = [
    "std",
    "driver",
    "dynamic-loading",
    "cuda-12060",
    "nvrtc",
], optional = true }

[[test]]
name = "planning"
path = "tests/planning.rs"

[[test]]
name = "gpu_kernels"
path = "tests/gpu_kernels.rs"
required-features = ["gpu-tests"]

[[test]]
name = "gpu_slice_b"
path = "tests/gpu_slice_b.rs"
required-features = ["gpu-tests"]

[[test]]
name = "gpu_reduce"
path = "tests/gpu_reduce.rs"
required-features = ["gpu-tests"]

[[test]]
name = "gpu_gather_scatter"
path = "tests/gpu_gather_scatter.rs"
required-features = ["gpu-tests"]

[[test]]
name = "gpu_convert"
path = "tests/gpu_convert.rs"
required-features = ["gpu-tests"]

[[test]]
name = "gpu_elementwise"
path = "tests/gpu_elementwise.rs"
required-features = ["gpu-tests"]

[[test]]
name = "gpu_linalg_aux"
path = "tests/gpu_linalg_aux.rs"
required-features = ["gpu-tests"]

[[test]]
name = "gpu_rrqr"
path = "tests/gpu_rrqr.rs"
required-features = ["gpu-tests"]

[[test]]
name = "gpu_fusion"
path = "tests/gpu_fusion.rs"
required-features = ["gpu-tests"]

[[example]]
name = "bench_kernels"
path = "examples/bench_kernels.rs"
required-features = ["gpu-tests"]

[[test]]
name = "gpu_dynamic_rank"
path = "tests/gpu_dynamic_rank.rs"
required-features = ["gpu-tests"]

[[test]]
name = "gpu_remaining_families"
path = "tests/gpu_remaining_families.rs"
required-features = ["gpu-tests"]

[[test]]
name = "gpu_tril_dus"
path = "tests/gpu_tril_dus.rs"
required-features = ["gpu-tests"]
