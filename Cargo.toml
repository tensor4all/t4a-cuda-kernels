required-features = ["gpu-tests"]

[[test]]
name = "gpu_strided_elementwise"
path = "tests/gpu_strided_elementwise.rs"
required-features = ["gpu-tests"]

[[test]]
name = "gpu_tril_dus"
path = "tests/gpu_tril_dus.rs"
required-features = ["gpu-tests"]
