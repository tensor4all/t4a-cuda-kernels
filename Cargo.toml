[package]
name = "t4a-cuda-kernels"
version = "0.4.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
authors = ["Hiroshi Shinaoka <h.shinaoka@gmail.com>", "tensor4all contributors"]
repository = "https://github.com/tensor4all/t4a-cuda-kernels"
description = "Runtime-independent CUDA kernels for tensor4all and external CUDA consumers"
readme = "README.md"
keywords = ["cuda", "gpu", "kernels", "nvrtc", "tensor4all"]
categories = ["hardware-support", "science"]
# The NVRTC sources under cuda/ are part of the library (include_str!); design docs,
# worklogs and benchmark tooling stay in the repository.
include = [
    "/src/**",
    "/cuda/**",
    "/metal/**",
    "/tests/**",
    "/examples/**",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/NOTICE",
    "/THIRD_PARTY_NOTICES.md",
]

[features]
default = []
# Tests that compile the kernel sources with nvcc and run them on a real device.
# An invoked GPU test on a host without a usable device fails; it never silently
# passes.
gpu-tests = ["dep:cudarc"]
# Tests that compile the MSL sources with the run-time Metal compiler and run them
# on an Apple GPU. An invoked Metal test on a host without a device fails; it
# never silently passes.
gpu-tests-metal = ["dep:t4a-metal-runtime"]

[dependencies]
# Only the GPU tests use it; the library itself has no dependency.
cudarc = { version = "=0.19.8", default-features = false, features = [
    "std",
    "driver",
    "dynamic-loading",
    "cuda-12060",
    "nvrtc",
], optional = true }
# The Metal device lane only. MSL needs a device and a run-time compiler, and this
# is the run-time-loaded runtime that provides both; it opens Metal with `dlopen`,
# so nothing is linked at build time and the default build does not use it.
t4a-metal-runtime = { git = "https://github.com/tensor4all/t4a-gpu-backend", rev = "b8dee5e99c1936225e50d57a4a237527ffd5d67f", version = "=0.1.0", optional = true }

# Both GPU dependencies are used only by the test targets their features select, so
# this crate's own code has none of them: cargo's unused-dependency lint cannot see
# a test target and would report them even though the feature that pulls one in is
# exactly what uses it.
[lints.cargo]
unused_dependencies = "allow"

[[test]]
name = "metal_planning"
path = "tests/metal_planning.rs"

[[test]]
name = "metal_kernels"
path = "tests/metal_kernels.rs"
required-features = ["gpu-tests-metal"]

[[test]]
name = "planning"
path = "tests/planning.rs"

[[test]]
name = "gpu_reduce_golden"
path = "tests/gpu_reduce_golden.rs"
required-features = ["gpu-tests"]

[[test]]
name = "gpu_kernels"
path = "tests/gpu_kernels.rs"
required-features = ["gpu-tests"]

[[test]]
name = "gpu_slice_b"
path = "tests/gpu_slice_b.rs"
required-features = ["gpu-tests"]

[[test]]
name = "gpu_reduce"
path = "tests/gpu_reduce.rs"
required-features = ["gpu-tests"]

[[test]]
name = "gpu_gather_scatter"
path = "tests/gpu_gather_scatter.rs"
required-features = ["gpu-tests"]

[[test]]
name = "gpu_convert"
path = "tests/gpu_convert.rs"
required-features = ["gpu-tests"]

[[test]]
name = "gpu_elementwise"
path = "tests/gpu_elementwise.rs"
required-features = ["gpu-tests"]

[[test]]
name = "gpu_linalg_aux"
path = "tests/gpu_linalg_aux.rs"
required-features = ["gpu-tests"]

[[test]]
name = "gpu_rrqr"
path = "tests/gpu_rrqr.rs"
required-features = ["gpu-tests"]

[[test]]
